name: pages

# Publishes ONLY the clean-room synthetic demo (scripts/build_demo.py).
# It never reads a real .nightward/ store, so no captured user data can leak.
#
# Manual dispatch only: publishing the demo is a launch step (docs/RELEASING.md),
# taken after the legal-review gate. It serves synthetic data only.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]   # optional, after launch

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build clean-room demo site
        run: python scripts/build_demo.py demo-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

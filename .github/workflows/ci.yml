name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        # Most tests run nightward (and a nested pytest) as subprocesses: run them
        # in parallel. Each test uses its own tmp_path, so workers don't share state.
        run: pytest -q -n auto

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Gate against the COMMITTED baselines - never approve first, or the gate
      # only checks itself and can't fail.
      - name: committed examples stay intact
        run: |
          nightward run example && nightward gate
          (cd examples/petshop && nightward run . && nightward gate)
          (cd examples/inbox && nightward run . && nightward gate)
      - name: gate blocks a real regression
        run: |
          sed -i 's/subtotal \* 0.1/subtotal * 0.2/' example/app.py
          nightward run example
          if nightward gate; then echo "gate passed a regression"; exit 1; fi
          git checkout -- example/app.py
      - name: semantic judge contract (examples/newsroom, key-free personas)
        working-directory: examples/newsroom
        run: |
          # committed baseline must be intact as-is
          nightward run .
          nightward gate
          # simulated LLM drift breaches the exact gate...
          NEWSROOM_REWRITE=1 nightward run .
          if nightward gate; then
            echo "expected a breach without a judge" && exit 1
          fi
          # ...and a judge collapses it to intact, with an audit trail
          NEWSROOM_REWRITE=1 nightward run . --judge persona:lenient
          nightward gate
          # --judge is a one-run override: the next plain run is exact again (D14)
          NEWSROOM_REWRITE=1 nightward run .
          if nightward gate; then
            echo "a --judge override leaked into a later run" && exit 1
          fi

  # The published GitHub Action (action.yml), run from this checkout: it must
  # pass the committed example and block a seeded regression, on both OSes.
  action:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: the action passes the committed example
        id: ok
        uses: ./
        with:
          path: example
          install: "false"
      - shell: bash
        run: test "${{ steps.ok.outputs.boundary }}" = intact
      - name: seed a regression
        shell: bash
        run: sed -i 's/subtotal \* 0.1/subtotal * 0.2/' example/app.py
      - name: the action blocks it
        id: bad
        uses: ./
        continue-on-error: true
        with:
          path: example
          install: "false"
      - shell: bash
        run: |
          test "${{ steps.bad.outcome }}" = failure
          test "${{ steps.bad.outputs.boundary }}" = breached

  # Non-blocking: build the dashboard from clean-room demo data and upload it as
  # a preview artifact. This must NOT gate the PR — view explains, gate blocks.
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build dashboard preview (synthetic data)
        run: python scripts/build_demo.py preview-site
      - uses: actions/upload-artifact@v4
        with:
          name: nightward-dashboard-preview
          path: preview-site
